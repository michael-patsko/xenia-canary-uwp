name: Xbox UWP build

# Builds the Xbox Dev Mode (UWP) package, including PR #5's structured
# forward jumps, signed with a throwaway certificate for sideloading.

on:
  push:
    branches: [harms-way-fix, harms-way-diag]
  workflow_dispatch:

jobs:
  build:
    name: Build UWP package
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A stalled fetch aborts after 60 s below 1 KB/s and is retried. The
      # step limit is generous: on slow runners the checkouts alone can take
      # 20-40 s per submodule (3 Nov 2026), which is slow but not stuck.
      - name: Submodules
        timeout-minutes: 45
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 60
        run: |
          $paths = (Select-String -CaseSensitive '(?<=path = )(?!third_party\/(FidelityFX-(CAS|FSR)|premake-(androidndk|cmake|export-compile-commands))).+' .gitmodules).Matches.Value
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git submodule update --init --depth=1 -j $env:NUMBER_OF_PROCESSORS $paths
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Submodule update failed (attempt $attempt of 3)"
            Start-Sleep -Seconds 10
          }
          exit 1

      # The pinned premake-core is from 2017, but FFmpeg's premake5.lua needs
      # linktimeoptimization (premake 5.0.0-beta4+), and premake5.lua still uses the
      # FatalWarnings flag that beta8 removed, so beta7 is the newest that fits. xenia-build.py passes
      # --scripts=third_party/premake-core, so the scripts and the binary both
      # have to be the newer version.
      - name: Premake 5.0.0-beta7
        run: |
          git -C third_party\premake-core fetch --depth=1 origin tag v5.0.0-beta7
          git -C third_party\premake-core checkout --quiet v5.0.0-beta7
          Invoke-WebRequest https://github.com/premake/premake-core/releases/download/v5.0.0-beta7/premake-5.0.0-beta7-windows.zip -OutFile premake.zip
          if ((Get-FileHash premake.zip -Algorithm SHA256).Hash -ne '8BAEC7B265FD43050F006EF47000457FA93B6FAFBB1EAD7E333E862A467C2E95') { throw "premake download checksum mismatch" }
          Expand-Archive premake.zip -DestinationPath third_party\premake-core\bin\release -Force
          Get-ChildItem third_party\premake-core\bin\release

      - name: Premake
        run: python xenia-build.py premake

      - uses: microsoft/setup-msbuild@v2

      - name: Restore C++/WinRT
        run: nuget restore xenia-canary-uwp\packages.config -PackagesDirectory build\packages

      - name: Signing certificate
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=XeniaUWPFix" -KeyUsage DigitalSignature `
            -FriendlyName "Xenia UWP fix (sideload only)" -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $password = ConvertTo-SecureString -String "xenia123" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath xenia-canary-uwp\XeniaDevCert.pfx -Password $password | Out-Null
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build
        run: >
          msbuild xenia-canary-uwp\xenia-canary-uwp.vcxproj /m /v:minimal
          /p:Configuration=Release /p:Platform=x64
          /p:SolutionDir=$env:GITHUB_WORKSPACE\build\
          /p:AppxBundle=Always /p:AppxBundlePlatforms=x64
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxPackageDir=$env:GITHUB_WORKSPACE\out\
          /p:PackageCertificateKeyFile=XeniaDevCert.pfx
          /p:PackageCertificatePassword=xenia123
          /p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT

      - uses: actions/upload-artifact@v4
        with:
          name: xenia-canary-uwp-${{ github.ref_name }}
          path: out\**
          if-no-files-found: error
